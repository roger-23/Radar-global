name: Atualizar Radar Global

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"
  push:
    paths:
      - "radar.py"
      - ".github/workflows/update-radar.yml"

permissions:
  contents: write

jobs:
  atualizar-ranking:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install yfinance
      - name: Calcular ranking
        run: python radar.py
      - name: Publicar ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking.json
          if git diff --cached --quiet; then
            echo "Ranking sem alterações."
          else
            git commit -m "Atualiza ranking diário do Radar Global"
            git push
          fi
